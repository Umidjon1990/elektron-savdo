    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
      html, body { height: auto !important; overflow: auto !important; min-height: 100vh; -webkit-overflow-scrolling: touch; touch-action: pan-x pan-y; }
      body { color: #1e293b; background-color: #f1f5f9; font-family: 'Inter', 'Segoe UI', Arial, sans-serif !important; }
      input, textarea, [contenteditable] { -webkit-user-select: text; user-select: text; }
      #root { min-height: 100vh; min-height: 100dvh; }
      @media (display-mode: standalone) {
        html { overscroll-behavior-y: contain; }
        body { padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  </body>
